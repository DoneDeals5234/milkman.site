<svg viewBox="0 0 540 540" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Background Radial Glow -->
<radialGradient cx="50%" cy="45%" id="hubGlow" r="55%">
<stop offset="0%" stop-color="#10b981" stop-opacity="0.14"></stop>
<stop offset="50%" stop-color="#1c1815" stop-opacity="0.9"></stop>
<stop offset="100%" stop-color="#110e0c" stop-opacity="1"></stop>
</radialGradient>
<!-- Milk Stream Gradient -->
<linearGradient id="milkStreamGrad" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"></stop>
<stop offset="50%" stop-color="#f8fafc" stop-opacity="0.9"></stop>
<stop offset="100%" stop-color="#34d399" stop-opacity="0.8"></stop>
</linearGradient>
<!-- Cow Body Gradient -->
<linearGradient id="cowBodyGrad" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#f8fafc"></stop>
<stop offset="100%" stop-color="#cbd5e1"></stop>
</linearGradient>
<!-- Cow Spot Gradient -->
<linearGradient id="cowSpotGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#334155"></stop>
<stop offset="100%" stop-color="#1e293b"></stop>
</linearGradient>
<!-- Pink Udder Gradient -->
<linearGradient id="pinkGrad" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#f472b6"></stop>
<stop offset="100%" stop-color="#db2777"></stop>
</linearGradient>
<!-- Milk Pail Metallic Gradient -->
<linearGradient id="bucketGrad" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#64748b"></stop>
<stop offset="25%" stop-color="#94a3b8"></stop>
<stop offset="50%" stop-color="#e2e8f0"></stop>
<stop offset="75%" stop-color="#94a3b8"></stop>
<stop offset="100%" stop-color="#475569"></stop>
</linearGradient>
<!-- Milk Fill Gradient Inside Bucket -->
<linearGradient id="milkFillGrad" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#ffffff"></stop>
<stop offset="35%" stop-color="#f0fdf4"></stop>
<stop offset="100%" stop-color="#a7f3d0"></stop>
</linearGradient>
<!-- Milkman Kurta Gradient -->
<linearGradient id="kurtaGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#10b981"></stop>
<stop offset="100%" stop-color="#047857"></stop>
</linearGradient>
<!-- Milkman Turban Gradient -->
<linearGradient id="turbanGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#f59e0b"></stop>
<stop offset="100%" stop-color="#d97706"></stop>
</linearGradient>
<!-- Farmer Skin Gradient -->
<linearGradient id="skinGrad" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#fcd34d"></stop>
<stop offset="100%" stop-color="#d97706"></stop>
</linearGradient>
<!-- Filters -->
<filter height="160%" id="emeraldGlow" width="160%" x="-30%" y="-30%">
<feDropShadow dx="0" dy="0" flood-color="#10b981" flood-opacity="0.4" stdDeviation="8"></feDropShadow>
</filter>
<filter height="140%" id="milkGlow" width="140%" x="-20%" y="-20%">
<feDropShadow dx="0" dy="2" flood-color="#34d399" flood-opacity="0.6" stdDeviation="5"></feDropShadow>
</filter>
<filter height="120%" id="softShadow" width="120%" x="-10%" y="-10%">
<feDropShadow dx="0" dy="4" flood-color="#000000" flood-opacity="0.6" stdDeviation="6"></feDropShadow>
</filter>
<!-- Bucket Fill Clip Path (Tapered Bucket) -->
<clipPath id="bucketInteriorClip">
<polygon points="243,285 297,285 291,348 249,348"></polygon>
</clipPath>
</defs>
<style>
    /* Continuous 6.5-second milking & fill loading loop */
    @keyframes milkFillRise {
      0% {
        transform: translateY(60px);
      }
      80% {
        transform: translateY(0px);
      }
      92% {
        transform: translateY(0px);
      }
      98%, 100% {
        transform: translateY(60px);
      }
    }

    /* Periodic Milk squirts / streams */
    @keyframes jetLeft {
      0%, 100% {
        opacity: 0.15;
        stroke-dashoffset: 40;
        stroke-width: 1.5;
      }
      15%, 35%, 55%, 75% {
        opacity: 0.95;
        stroke-dashoffset: 0;
        stroke-width: 3.5;
      }
      25%, 45%, 65%, 85% {
        opacity: 0.2;
        stroke-dashoffset: -20;
        stroke-width: 1.5;
      }
    }

    @keyframes jetRight {
      0%, 100% {
        opacity: 0.2;
        stroke-dashoffset: -20;
        stroke-width: 1.5;
      }
      20%, 40%, 60%, 80% {
        opacity: 0.95;
        stroke-dashoffset: 0;
        stroke-width: 3.5;
      }
      30%, 50%, 70%, 90% {
        opacity: 0.15;
        stroke-dashoffset: 40;
        stroke-width: 1.5;
      }
    }

    /* Hands rhythmic squeezing motion */
    @keyframes farmerHandSqueeze {
      0%, 100% {
        transform: rotate(0deg) translateY(0px);
      }
      20% {
        transform: rotate(-4deg) translateY(-2px);
      }
      30% {
        transform: rotate(3deg) translateY(3px);
      }
      60% {
        transform: rotate(-3deg) translateY(-1px);
      }
      70% {
        transform: rotate(4deg) translateY(3px);
      }
    }

    /* Teat squeeze elasticity */
    @keyframes teatLeftPump {
      0%, 100% { transform: scale(1, 1); }
      20% { transform: scale(0.85, 1.25); }
      35% { transform: scale(1.05, 0.9); }
    }
    @keyframes teatRightPump {
      0%, 100% { transform: scale(1, 1); }
      60% { transform: scale(0.85, 1.25); }
      75% { transform: scale(1.05, 0.9); }
    }

    /* Milk Splash & Froth bubbling */
    @keyframes foamBoil {
      0%, 100% { transform: scaleY(1) translateY(0px); }
      50% { transform: scaleY(1.15) translateY(-1.5px); }
    }
    @keyframes dropletBurst {
      0% { opacity: 0; transform: translateY(0px) scale(0.5); }
      50% { opacity: 0.9; transform: translateY(-12px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-18px) scale(0.2); }
    }

    /* Tail Wagging peacefully */
    @keyframes tailWag {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(18deg); }
    }

    /* Cow head chewing & calm breathing */
    @keyframes cowBreathe {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(3px) rotate(1.5deg); }
    }

    /* Outer Progress Circular Track */
    @keyframes circularLoaderProgress {
      0% {
        stroke-dashoffset: 754;
      }
      80% {
        stroke-dashoffset: 0;
      }
      92% {
        stroke-dashoffset: 0;
      }
      100% {
        stroke-dashoffset: 754;
      }
    }

    .loader-ring {
      stroke-dasharray: 754;
      transform-origin: 270px 270px;
      animation: circularLoaderProgress 6.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .milk-rising {
      animation: milkFillRise 6.5s cubic-bezier(0.3, 0.0, 0.2, 1) infinite;
    }

    .jet-left {
      stroke-dasharray: 20 8;
      animation: jetLeft 1.2s ease-in-out infinite;
    }

    .jet-right {
      stroke-dasharray: 20 8;
      animation: jetRight 1.2s ease-in-out infinite;
    }

    .hand-movement {
      transform-origin: 290px 260px;
      animation: farmerHandSqueeze 1.2s ease-in-out infinite;
    }

    .teat-l {
      transform-origin: 260px 248px;
      animation: teatLeftPump 1.2s ease-in-out infinite;
    }

    .teat-r {
      transform-origin: 278px 250px;
      animation: teatRightPump 1.2s ease-in-out infinite;
    }

    .foam-layer {
      animation: foamBoil 0.8s ease-in-out infinite;
    }

    .splash-drop-1 {
      animation: dropletBurst 1.2s ease-out infinite 0.2s;
    }
    .splash-drop-2 {
      animation: dropletBurst 1.2s ease-out infinite 0.6s;
    }
    .splash-drop-3 {
      animation: dropletBurst 1.2s ease-out infinite 0.9s;
    }

    .tail-wag {
      transform-origin: 360px 200px;
      animation: tailWag 1.8s ease-in-out infinite;
    }

    .cow-head {
      transform-origin: 160px 190px;
      animation: cowBreathe 2.4s ease-in-out infinite;
    }

    @keyframes pulseSoft {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    .pulse-glow {
      animation: pulseSoft 2.5s ease-in-out infinite;
    }
  </style>
<!-- Ambient Dark Card Backdrop -->
<rect fill="url(#hubGlow)" height="540" rx="36" width="540"></rect>
